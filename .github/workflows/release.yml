name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit dist/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || git commit -m "chore: bundle dist for ${{ github.ref_name }}"
          git push origin HEAD:main || true

      - name: Move major version tag (e.g. v1 → latest v1.x.x)
        run: |
          MAJOR=$(echo "${{ github.ref_name }}" | grep -oP '^v\d+')
          git tag -fa "$MAJOR" -m "Release ${{ github.ref_name }}"
          git push origin "$MAJOR" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
