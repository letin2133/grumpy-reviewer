name: Self-review (dogfood)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  grumpy-senior:
    name: "😤 Grumpy Senior review"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          persona: grumpy-senior
          provider: openai        # 9router / OpenAI-compatible
          base-url: ${{ secrets.API_BASE_URL }}   # e.g. https://your-proxy.com/v1
          model: ${{ secrets.MODEL_NAME }}         # e.g. gpt-4o or claude-3-5-sonnet
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  zen-master:
    name: "🧘 Zen Master review"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          persona: zen-master
          provider: openai
          base-url: ${{ secrets.API_BASE_URL }}
          model: ${{ secrets.MODEL_NAME }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
